schema_version: "1.0"
source: tests/auto_test_instructions.md

categories:
  - routing_smoke
  - shared_conventions
  - catalog_discovery
  - data_workflow
  - helper_contract
  - end_to_end

types:
  - single_turn
  - fixture_based
  - multi_step
  - pre_test
  - command_contract

pre_test_checks:
  - id: PRE-01
    category: helper_contract
    type: pre_test
    name: Verify referenced files exist
    instructions: >
      Before running behavioral prompts, scan active Markdown, YAML, shell, and
      Python files for file-looking references and verify that each target
      exists. If a target is missing, report whether no likely target exists or
      whether a similarly named nearby file suggests a filename inconsistency.
      Stop the behavioral run, alert the user with the exact source path and
      referenced target, and ask the user to decide whether to create/restore
      the missing target, rename the file, update the reference, or retire the
      stale test/doc.
    required_canonical_files:
      - .claude/skills/imf-ra-catalog/databases/non_vintage_datasets.csv
      - .claude/skills/imf-ra-catalog/databases/vintage_datasets.csv
      - .claude/skills/imf-ra-catalog/indicators/1. non_vintage_variable_list.csv
      - .claude/skills/imf-ra-catalog/indicators/2. bbg_variable_list.csv
      - .claude/skills/imf-ra-catalog/indicators/3. wdi_variable_list.csv
      - .claude/skills/imf-ra-catalog/indicators/4. wto_variable_List.csv
    scan_targets:
      - .claude
      - README.md
      - CLAUDE.md
      - tests/auto_test_cases.yaml
      - tests/auto_test_instructions.md
      - tests/results/auto_test_results_template.yaml
      - tests/results/auto_test_report_template.md
    suggested_commands:
      - bash .claude/skills/imf-ra/scripts/check_references.sh
      - python3 tests/check_referenced_files.py
    pass_condition: >
      The skill reference checker passes, all required/canonical paths exist,
      and the broader referenced-file scanner reports that every active
      file-looking reference resolves.

cases:
  - id: SMOKE-01
    category: routing_smoke
    type: single_turn
    prompt: "Pull WEO real GDP growth for G20 countries, 2010-present."
    expected_primary_skill: imf-ra-data
    expected_behavior: >
      Treats this as a direct fetch request, not a broad discovery question.
    evidence_sources:
      required_files:
        - .claude/skills/imf-ra/SKILL.md
        - .claude/skills/imf-ra-data/SKILL.md
        - .claude/skills/imf-ra-catalog/indicators/1. non_vintage_variable_list.csv
      optional_commands:
        - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py search "real GDP growth"
    assertions:
      required:
        - start_data_retrieval_flow
        - preserve_direct_fetch_intent
        - identify_missing_fetch_inputs
      forbidden:
        - treat_as_broad_orientation
        - invent_identifier
        - fetch_without_output_format

