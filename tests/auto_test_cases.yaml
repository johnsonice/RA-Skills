schema_version: '1.0'
source: tests/auto_test_instructions.md
categories:
- core_behavior_pipeline
- catalog_helper_behavior
- weo_group_helper_behavior
- data_workflow_guardrails
- command_contracts
types:
- single_turn
- fixture_based
- multi_step
- pre_test
- command_contract
pre_test_checks:
- id: PRE-01
  category: command_contracts
  type: pre_test
  name: Verify referenced files exist
  instructions: 'Before running behavioral prompts, scan active Markdown, YAML, shell, and Python files for file-looking references and verify that each target exists. If a target is missing, report whether no likely target exists or whether a similarly named nearby file suggests a filename inconsistency. Stop the behavioral run, alert the user with the exact source path and referenced target, and ask the user to decide whether to create/restore the missing target, rename the file, update the reference, or retire the stale test/doc.

'
  required_canonical_files:
  - ".claude/skills/imf-ra-catalog/databases/non_vintage_datasets.csv"
  - ".claude/skills/imf-ra-catalog/databases/vintage_datasets.csv"
  - ".claude/skills/imf-ra-catalog/indicators/1. non_vintage_variable_list.csv"
  - ".claude/skills/imf-ra-catalog/indicators/2. bbg_variable_list.csv"
  - ".claude/skills/imf-ra-catalog/indicators/3. wdi_variable_list.csv"
  - ".claude/skills/imf-ra-catalog/indicators/4. wto_variable_List.csv"
  scan_targets:
  - ".claude"
  - README.md
  - CLAUDE.md
  - tests/auto_test_cases.yaml
  - tests/auto_test_instructions.md
  - tests/results/auto_test_results_template.yaml
  - tests/results/auto_test_report_template.md
  suggested_commands:
  - bash .claude/skills/imf-ra/scripts/check_references.sh
  - python3 tests/check_referenced_files.py
  pass_condition: 'The skill reference checker passes, all required/canonical paths exist, and the broader referenced-file scanner reports that every active file-looking reference resolves.

'
cases:
- id: SMOKE-01
  category: core_behavior_pipeline
  type: single_turn
  prompt: Pull WEO real GDP growth for G20 countries, 2010-present.
  expected_primary_skill: imf-ra-data
  expected_behavior: 'Treats this as a direct fetch request, not a broad discovery question.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra/SKILL.md"
    - ".claude/skills/imf-ra-data/SKILL.md"
    - ".claude/skills/imf-ra-catalog/indicators/1. non_vintage_variable_list.csv"
    optional_commands:
    - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py search "real GDP growth"
  assertions:
    required:
    - start_data_retrieval_flow
    - preserve_direct_fetch_intent
    - identify_missing_fetch_inputs
    forbidden:
    - treat_as_broad_orientation
    - invent_identifier
    - fetch_without_output_format
- id: SMOKE-02
  category: core_behavior_pipeline
  type: single_turn
  prompt: I'm starting a project on emerging market debt - orient me to what's available.
  expected_primary_skill: imf-ra
  expected_behavior: 'Provides broad orientation across available sources or workflows instead of jumping straight into a narrow fetch.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra/SKILL.md"
    - ".claude/skills/imf-ra-catalog/databases/database_overview.md"
  assertions:
    required:
    - provide_orientation
    - describe_relevant_sources_or_workflows
    forbidden:
    - start_narrow_fetch_without_identifier
    - invent_identifier
- id: CONV-01
  category: weo_group_helper_behavior
  type: single_turn
  area: No unnecessary code
  prompt: Which countries are in the WEO advanced economies group?
  expected_primary_skill: imf-ra
  expected_behavior: 'Answers from the WEO group reference or CSV contents instead of writing code if simple inspection is enough.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra/references/Country Group/weo_country_groups.md"
    - ".claude/skills/imf-ra/references/Country Group/csv/2. country_groups.csv"
    - ".claude/skills/imf-ra/references/Country Group/csv/3. country_group_composition.csv"
    optional_commands:
    - python3 .claude/skills/imf-ra/scripts/weo_country_groups.py members G110
  assertions:
    required:
    - use_weo_group_reference
    - answer_with_reference_backed_membership
    forbidden:
    - write_new_script
    - guess_group_membership
- id: CONV-02
  category: weo_group_helper_behavior
  type: single_turn
  area: Country-group translation
  prompt: For IMF purposes, what does EMDE mean here?
  expected_primary_skill: imf-ra
  expected_behavior: 'Uses the WEO group reference instead of guessing from memory, but treats "IMF purposes" as framework-ambiguous because both WEO and SPR/PRGT are IMF frameworks. The agent should explain that WEO EMDE maps to G200, SPR/PRGT EMDE is represented by G-PRGT-EM plus G-PRGT-LIC, and ask the user to choose WEO or SPR/PRGT before committing to a group.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra/references/Country Group/weo_country_groups.md"
    - ".claude/skills/imf-ra/references/Country Group/csv/2. country_groups.csv"
    optional_commands:
    - python3 .claude/skills/imf-ra/scripts/weo_country_groups.py explain EMDE
  expected_outputs:
    weo_groupcode: G200
    spr_prgt_groupcodes:
    - G-PRGT-EM
    - G-PRGT-LIC
  assertions:
    required:
    - use_weo_group_reference
    - include_groupcode_G200
    - include_spr_prgt_groupcodes
    - ask_framework_clarification
    forbidden:
    - answer_from_memory_only
    - invent_group_definition
    - commit_to_weo_without_framework_confirmation
- id: CONV-03
  category: core_behavior_pipeline
  type: single_turn
  area: Uncertainty policy
  prompt: Get me the IMF inflation series.
  expected_primary_skill: imf-ra
  expected_behavior: 'Does not guess; asks a clarifying question because multiple plausible indicators or databases exist.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra/SKILL.md"
    - ".claude/skills/imf-ra-catalog/SKILL.md"
    - ".claude/skills/imf-ra-catalog/indicators/1. non_vintage_variable_list.csv"
    optional_commands:
    - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py search "inflation CPI" --all-databases
  assertions:
    required:
    - ask_clarification
    - acknowledge_multiple_plausible_series
    forbidden:
    - select_single_inflation_series_without_support
    - invent_identifier
- id: HPIPE-01
  category: catalog_helper_behavior
  type: single_turn
  area: Resolve-first catalog handoff
  prompt: Find the identifier for WEO real GDP growth and prepare the catalog handoff. Do not download yet.
  expected_primary_skill: imf-ra-catalog
  expected_behavior: 'Uses the catalog helper command map and runs the strict resolve path, returning a handoff-ready tuple only after `status=resolved`.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra/SKILL.md"
    - ".claude/skills/imf-ra-catalog/SKILL.md"
    - ".claude/skills/imf-ra-catalog/scripts/catalog_search.py"
    - ".claude/skills/imf-ra-catalog/scripts/catalog_lookup.py"
    required_commands:
    - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py resolve "real GDP growth" --json
  expected_outputs:
    status: resolved
    database: IMF.RES.WEO:WEO_LIVE
    dimension_name: INDICATOR
    code: NGDP_RPCH
  machine_checks:
    required_command_evidence:
    - command: python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py resolve "real GDP growth" --json
      stdout_contains:
      - '"status": "resolved"'
      - '"database": "IMF.RES.WEO:WEO_LIVE"'
      - '"dimension_name": "INDICATOR"'
      - '"code": "NGDP_RPCH"'
    final_response_must_include:
    - IMF.RES.WEO:WEO_LIVE
    - INDICATOR
    - NGDP_RPCH
    final_response_must_not_include:
    - downloaded
    - fetched
  assertions:
    required:
    - consult_catalog_helper_map
    - use_resolve_json_for_handoff
    - return_handoff_only_when_status_resolved
    - preserve_database_dimension_code
    forbidden:
    - write_temporary_lookup_code
    - use_search_output_as_manual_handoff
    - fetch_from_catalog_context
- id: HPIPE-02
  category: catalog_helper_behavior
  type: single_turn
  area: Source routing before indicator lookup
  prompt: For an IFS CPI request, identify the replacement database and code path before any fetch.
  expected_primary_skill: imf-ra-catalog
  expected_behavior: 'Treats IFS as source-routing, runs `explain-source`, then searches or resolves against the routed CPI database instead of defaulting to WEO.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra-catalog/SKILL.md"
    - ".claude/skills/imf-ra-catalog/scripts/catalog_routing.py"
    required_commands:
    - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py explain-source "IFS CPI for the United States" --json
    optional_commands:
    - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py search "IFS CPI for the United States"
  expected_outputs:
    database: IMF.STA:CPI
  machine_checks:
    required_command_evidence:
    - command: python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py explain-source "IFS CPI for the United States" --json
      stdout_contains:
      - '"status": "routed"'
      - '"database": "IMF.STA:CPI"'
      - IFS is a legacy EcOS source
    final_response_must_include:
    - IMF.STA:CPI
    - IFS
    final_response_must_not_include:
    - IMF.RES.WEO:WEO_LIVE
  assertions:
    required:
    - use_explain_source_for_ifs
    - identify_replacement_database_IMF.STA.CPI
    - preserve_ifs_migration_note
    forbidden:
    - treat_ifs_as_single_idata_database
    - default_ifs_request_to_weo_live
    - write_temporary_routing_code
- id: HPIPE-03
  category: catalog_helper_behavior
  type: single_turn
  area: Ambiguity gate blocks unsafe handoff
  prompt: Find WDI GDP per capita and prepare it for handoff.
  expected_primary_skill: imf-ra-catalog
  expected_behavior: 'Uses the WDI-specific resolve command and stops on variant ambiguity instead of choosing a GDP-per-capita series manually.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra-catalog/SKILL.md"
    - ".claude/skills/imf-ra-catalog/scripts/catalog_search.py"
    - ".claude/skills/imf-ra-catalog/scripts/catalog_lookup.py"
    - ".claude/skills/imf-ra-catalog/indicators/3. wdi_variable_list.csv"
    required_commands:
    - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py resolve "GDP per capita" --database WB:WDI --json
  expected_outputs:
    status: ambiguous
    database: WB:WDI
    dimension_name: SERIES
  machine_checks:
    required_command_evidence:
    - command: python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py resolve "GDP per capita" --database WB:WDI --json
      stdout_contains:
      - '"status": "ambiguous"'
      - '"handoff": null'
      - '"database_name": "WB:WDI"'
      - '"code": "NY_GDP_PCAP_CD"'
      - '"code": "NY_GDP_PCAP_KD"'
    final_response_must_include:
    - WB:WDI
    - GDP per capita
    - clarify
    final_response_must_not_include:
    - handoff-ready
    - final code is NY_GDP_PCAP_CD
  assertions:
    required:
    - use_database_specific_wdi_lookup
    - preserve_wdi_variant_ambiguity
    - return_clarification_options
    forbidden:
    - choose_wdi_variant_without_confirmation
    - emit_handoff_when_status_ambiguous
    - write_temporary_csv_search
