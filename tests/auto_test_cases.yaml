  expected_behavior: 'Uses `compare-codes` to distinguish period-average versus end-of-period CPI inflation and asks the user which variant is intended.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra-catalog/SKILL.md"
    - ".claude/skills/imf-ra-catalog/scripts/catalog_search.py"
    required_commands:
    - python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py compare-codes PCPI_PCH PCPIE_PCH --database IMF.RES.WEO:WEO_LIVE
  machine_checks:
    required_command_evidence:
    - command: python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py compare-codes PCPI_PCH PCPIE_PCH --database IMF.RES.WEO:WEO_LIVE
      stdout_contains:
      - 'same_database: True'
