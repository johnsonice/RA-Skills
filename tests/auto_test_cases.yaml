  expected_outputs:
    database: IMF.RES.WEO:WEO_LIVE
    dimension_name: INDICATOR
    code: NGDP_RPCH
    groupcode: G200
    start: '2010'
    end: '2024'
  machine_checks:
    required_command_evidence:
    - command: python3 .claude/skills/imf-ra-catalog/scripts/catalog_search.py resolve "real GDP growth" --json
      stdout_contains:
      - '"code": "NGDP_RPCH"'
      - '"database": "IMF.RES.WEO:WEO_LIVE"'
    - command: python3 .claude/skills/imf-ra/scripts/weo_country_groups.py expand-for-idata G200 --codes-only
      stdout_contains:
      - AFG
      - CHN
      - NGA
    final_response_must_include:
    - NGDP_RPCH
    - 2010
    - 2024
    final_response_must_not_include:
    - use G200 as the country selector
  assertions:
    required:
    - use_catalog_resolve_for_indicator
    - use_weo_group_expand_for_idata
    - preserve_time_range_2010_2024
    - handoff_to_data_workflow_with_member_countrycodes
    forbidden:
    - use_groupcode_as_country_selector
    - write_temporary_catalog_or_group_lookup_code
    - fetch_without_output_format
