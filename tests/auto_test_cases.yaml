- id: HPIPE-07
  category: weo_group_helper_behavior
  type: multi_step
  area: Catalog plus country-group helper composition
  prompt: Prepare WEO real GDP growth for EMDEs, 2010-2024, for an iData pull.
  expected_primary_skill: imf-ra
  expected_behavior: 'Runs the catalog resolve helper for the indicator and the WEO group helper for EMDE expansion, then hands off confirmed fields to the data workflow without using G200 as a country selector.

'
  evidence_sources:
    required_files:
    - ".claude/skills/imf-ra/SKILL.md"
    - ".claude/skills/imf-ra-catalog/SKILL.md"
    - ".claude/skills/imf-ra/references/Country Group/weo_country_groups.md"
